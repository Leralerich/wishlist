<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(180deg, #ffe4ef 0%, #fff0f6 100%);
    color: #5a2a45;
    min-height: 100vh;
    padding: 40px 20px 60px;
  }

  /* Екран привітання */
  #welcome {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, #ffb6d5 0%, #ff8fc0 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    z-index: 10;
    transition: opacity 0.6s ease;
    text-align: center;
    padding: 20px;
  }
  #welcome.hidden {
    opacity: 0;
    pointer-events: none;
    visibility: hidden;
  }
  #welcome h1 {
    font-size: clamp(28px, 6vw, 48px);
    color: #fff;
    text-shadow: 0 2px 12px rgba(180, 0, 90, 0.3);
  }
  #welcome p {
    color: #fff;
    font-size: clamp(15px, 3vw, 19px);
    opacity: 0.95;
  }
  #welcome button {
    margin-top: 10px;
    padding: 14px 36px;
    font-size: 17px;
    border: none;
    border-radius: 50px;
    background: #fff;
    color: #e0559a;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(180, 0, 90, 0.25);
    transition: transform 0.15s;
  }
  #welcome button:hover { transform: scale(1.05); }

  /* Основний контент */
  #main {
    display: none;
  }
  #main.visible {
    display: block;
  }

  h2.title {
    text-align: center;
    color: #d94f96;
    font-size: clamp(24px, 5vw, 34px);
    margin-bottom: 30px;
  }

  .list {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .item {
    background: #fff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 4px 18px rgba(217, 79, 150, 0.15);
    border: 2px solid #ffd6e8;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .item:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 26px rgba(217, 79, 150, 0.25);
  }

  .item img {
    width: 100%;
    height: 260px;
    object-fit: cover;
    background: #ffe4ef;
    display: block;
  }

  .item-body {
    padding: 18px 22px 22px;
  }

  .item h3 {
    font-size: 20px;
    color: #b83a7a;
    margin-bottom: 10px;
  }

  .item a {
    display: inline-block;
    margin-top: 6px;
    color: #fff;
    background: linear-gradient(90deg, #ff8fc0, #e0559a);
    text-decoration: none;
    padding: 10px 22px;
    border-radius: 50px;
    font-size: 15px;
    font-weight: 600;
    box-shadow: 0 4px 12px rgba(224, 85, 154, 0.35);
    transition: transform 0.15s;
  }
  .item a:hover { transform: scale(1.05); }

  .empty {
    text-align: center;
    color: #c97aa8;
    font-size: 16px;
    padding: 40px 20px;
  }
</style>

<body>

<!-- Привітання -->

  <h1>Привіт-привіт! 💕</h1>

  // Показати список
  function showList() {
    document.getElementById('welcome').classList.add('hidden');
    document.getElementById('main').classList.add('visible');
  }

  // Намалювати список
  function render() {
    var list = document.getElementById('list');
    if (wishes.length === 0) {
      list.innerHTML = '<div class="empty">Поки що бажань немає 🌷</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < wishes.length; i++) {
      var w = wishes[i];
      html += '<div class="item">';
      if (w.photo) {
        html += '<img src="' + w.photo + '" alt="' + w.title + '">';
      }
      html += '<div class="item-body">';
      html += '<h3>' + w.title + '</h3>';
      if (w.link) {
        html += '<a href="' + w.link + '" target="_blank">Відкрити посилання →</a>';
      }
      html += '</div></div>';
    }
    list.innerHTML = html;
  }

  // Прив'язуємо кнопку ПІСЛЯ завантаження сторінки
  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('openBtn').addEventListener('click', showList);
    render();
  });
